[package]
name = "uq_core_lib"
version = "1.0.0"
edition = "2021"

[lib]
name = "uq_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = "2.0"
hex = "0.4"
rand = "0.8"
log = "0.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

