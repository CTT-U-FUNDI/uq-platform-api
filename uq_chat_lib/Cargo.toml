[package]
name = "uq_chat_lib"
version = "1.0.0"
edition = "2021"

[lib]
name = "uq_chat"
path = "src/lib.rs"

[dependencies]
bincode = "1.3"
uq_blockchain_lib = { path = "../uq_blockchain_lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = "2.0"
hex = "0.4"
rand = "0.8"
log = "0.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }


