[package]
name = "uq_blockchain_lib"
version = "1.0.0"
edition = "2021"

[lib]
name = "uq_blockchain"
path = "src/lib.rs"

[dependencies]
lazy_static = "1.4"
uq_black_key_standalone = { path = "../uq_black_key_standalone" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = "2.0"
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
log = "0.4"

