[package]
name = "uq_platform_bin"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "uq_platform"
path = "src/main.rs"

[dependencies]
bigdecimal = "0.4"
rust_decimal = "1.34"
rust_decimal_macros = "1.34"
num-bigint = "0.4"
num-traits = "0.2"
printpdf = "0.7"
qrcode = "0.14"
image = { version = "0.25", features = ["png", "jpeg"] }
ab_glyph = "0.2"
imageproc = "0.24"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"] }
actix-files = "0.6"
lazy_static = "1.4"
uq_player_lib = { path = "../uq_player_lib" }
uq_black_key_standalone = { path = "../uq_black_key_standalone" }
# Les 7 librairies UQ
uq_blockchain_lib = { path = "../uq_blockchain_lib" }
uq_cellular_lib = { path = "../uq_cellular_lib" }
uq_security_lib = { path = "../uq_security_lib" }
uq_core_lib = { path = "../uq_core_lib" }
uq_vault_lib = { path = "../uq_vault_lib" }
uq_chat_lib = { path = "../uq_chat_lib" }
uq_data_lib = { path = "../uq_data_lib" }

# Serveur HTTP
actix-web = "4.0"
actix-cors = "0.7"
tokio = { version = "1.0", features = ["full"] }

# Sérialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilitaires
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
hex = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Env loader for local development
dotenv = "0.15"
jsonwebtoken = "8"
crc32fast = "1.3"
uuid = { version = "1", features = ["v4"] }
# Verification cryptographique des assertions WebAuthn (passkey = autorite
# appareil<->compte). La version 0.17 est deja resolue dans Cargo.lock par
# rustls-webpki : aucune source nouvelle a telecharger.
ring = "0.17"
# ═══ OCR + VISION (Verification d'identite) ═══
base64 = "0.22"
regex = "1"
rustface = "0.1"
hmac = "0.12"
sha1 = "0.10"
ed25519-dalek = "2.0"





[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
















[dev-dependencies]
tempfile = "3.10"
